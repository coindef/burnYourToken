<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Usage</title>
</head>
<body>
  <header><p>Settings</p></header>
  <main>
    <h1>Usage</h1>
    <section>
      <h2>Plan usage limits</h2>
      <p>Pro</p>
      <section>
        <h3>Current session</h3>
        <p>Resets in 3 hr 12 min</p>
        <div role="progressbar" aria-valuenow="72" aria-valuemin="0" aria-valuemax="100" aria-label="Current session">72% used</div>
      </section>
      <section>
        <h3>Weekly limits</h3>
        <section>
          <h4>All models</h4>
          <p>Resets Thu 8:00 AM</p>
          <div role="progressbar" aria-valuenow="31" aria-valuemin="0" aria-valuemax="100" aria-label="All models">31% used</div>
        </section>
        <section>
          <h4>Sonnet only</h4>
          <p>Resets Thu 8:00 AM</p>
          <div role="progressbar" aria-valuenow="12" aria-valuemin="0" aria-valuemax="100" aria-label="Sonnet only">12% used</div>
        </section>
      </section>
      <p>Last updated: just now</p>
      <section>
        <h3>Usage credits</h3>
        <p>Prepaid balance, not a weekly window.</p>
        <div role="progressbar" aria-valuenow="90" aria-valuemin="0" aria-valuemax="100" aria-label="Usage credits">90% used</div>
      </section>
    </section>
  </main>
</body>
</html>
